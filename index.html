<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Form</title>
</head>

<body>
    <script>
        // Create the form dynamically
        const form = document.createElement('form');
        form.id = 'PayFast_payment_form';
        form.name = 'PayFast-payment-form';
        form.method = 'post';
        form.action = 'https://ipguat.apps.net.pk/Ecommerce/api/Transaction/PostTransaction';

        // Define form fields
        const fields = [
            { label: 'Currency Code:', name: 'CURRENCY_CODE', value: 'PKR' },
            { label: 'Merchant ID:', name: 'MERCHANT_ID', value: 'your-merchant-id' },
            { label: 'Merchant Name:', name: 'MERCHANT_NAME', value: 'UAT Demo Merchant' },
            { label: 'Token:', name: 'TOKEN', value: 'your-token' },
            { label: 'Success URL:', name: 'SUCCESS_URL', value: 'http://merchant-site-example.com' },
            { label: 'Failure URL:', name: 'FAILURE_URL', value: 'http://merchant-site-example.com' },
            { label: 'Checkout URL:', name: 'CHECKOUT_URL', value: 'http://merchant-site-example.com' },
            { label: 'Customer Email:', name: 'CUSTOMER_EMAIL_ADDRESS', value: 'some-email@example.com' },
            { label: 'Customer Mobile:', name: 'CUSTOMER_MOBILE_NO', value: '00000000000' },
            { label: 'Transaction Amount:', name: 'TXNAMT', value: 'transaction-amount' },
            { label: 'Basket ID:', name: 'BASKET_ID', value: 'basket-id' }
        ];

        // Add fields to the form
        fields.forEach(field => {
            const input = document.createElement('input');
            input.type = 'hidden'; // Hidden inputs for silent submission
            input.name = field.name;
            input.value = field.value;
            form.appendChild(input);
        });

        // Append form to the body
        document.body.appendChild(form);

        // Automatically submit the form
        form.submit();
    </script>
</body>

</html>
